[package]
name = "simulator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The browser binding layer. On by default, so `cargo build`, `cargo test` and wasm-pack are
# unchanged and no existing command needs a flag.
#
# `--no-default-features` drops `frontend.rs`, `compositional/frontend.rs` and the three binding
# crates, leaving the physics. The point is not a smaller build: it is that a second consumer
# (a native runner, a Python module) links the simulator without wasm-bindgen in its dependency
# graph, and that the boundary is enforced by the compiler rather than by convention. If a
# physics module ever fails to build without this feature, that is the feature earning its keep.
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2.128", optional = true }
js-sys = { version = "0.3.105", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
libm = "0.2.16"

# For dense vectors (RHS, pressure vector) and CG solver utilities
nalgebra = "0.35.0"
# For sparse matrices (the 'A' in Ax=b)
sprs = "0.11.5"
rand = "0.10.3"

[dependencies.getrandom]
version = "0.4.3"

# wasm_js is getrandom's browser backend. Scoped to wasm32 so a native build does not ask for a
# backend that only exists there.
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4.3"
features = ["wasm_js"]

[dev-dependencies]
# Test-only, and only for the compositional fluid specification's serialization contract
# (`comp_spec_serde_*`). It is not compiled into the wasm artifact and adds nothing to the
# shipped bundle. The contract it checks - that component order survives a roundtrip and that an
# unknown EOS/viscosity tag is rejected rather than silently defaulted - is a property of serde's
# behaviour, so testing it against a hand-rolled format would prove nothing.
serde_json = "1.0.151"
