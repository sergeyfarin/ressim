# Engine math must return the same bits on every target (#62). `f64`'s transcendental methods call
# the platform libm: glibc natively (which also dispatches on CPU features), the `libm` crate on
# wasm32. They differ in the last bit on ~6 % of `pow`/`exp` calls, and FIM amplifies that. Use
# `crate::math`, which calls the `libm` crate on every target. `sqrt`, `powi` and `mul_add` are
# exact or target-independent and stay allowed.
disallowed-methods = [
    { path = "f64::powf", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::exp", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::ln", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::log", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::log2", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::log10", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::exp2", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::exp_m1", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::ln_1p", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::sin", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::cos", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::tan", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::asin", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::acos", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::atan", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::atan2", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::sinh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::cosh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::tanh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::asinh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::acosh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::atanh", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::cbrt", reason = "not bit-identical across targets; use crate::math (#62)" },
    { path = "f64::hypot", reason = "not bit-identical across targets; use crate::math (#62)" },
]
