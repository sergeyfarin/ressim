name: PR — Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  vitest:
    name: Run unit tests & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ressim-benchmark-cache"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `src/lib/ressim/pkg/` is committed, so without this step every frontend
      # simulation test runs against whatever bindings happen to be checked in
      # rather than against the Rust source in the pull request.
      - name: Build WASM bindings from this revision
        run: bash scripts/build-wasm.sh

      - name: Run ESLint
        run: pnpm run lint

      - name: Check for runtime import cycles
        run: pnpm run check:cycles

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      # Previously only the IMPES bucket ran here, so a FIM convergence regression
      # or a cross-solver parity break passed CI. `all` is shared + FIM + IMPES.
      - name: Run Rust engine regression gates (shared + FIM + IMPES)
        run: bash scripts/validate-solver-coverage.sh all

      - name: Run Buckley-Leverett physics benchmarks
        run: cargo test --manifest-path src/lib/ressim/Cargo.toml benchmark_buckley -- --nocapture

      # `test:coverage` is the full vitest suite (`vitest run --coverage`), so it is
      # the pass/fail gate as well as the coverage producer. Running `pnpm run test`
      # first would execute the same ~8 minutes of scenario simulations twice.
      - name: Run unit tests (Vitest) and upload coverage
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/**

      - name: Build production bundle
        run: pnpm run build
