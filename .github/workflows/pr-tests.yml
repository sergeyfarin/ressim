name: PR — Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  vitest:
    name: Run unit tests & typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # validate-native-binding.sh lints engine math with clippy (#62).
          components: clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ressim-benchmark-cache"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `src/lib/ressim/pkg/` is generated and no longer committed (#30), so this
      # step is what produces the bindings every frontend simulation test loads.
      # The npm `pre*` hooks would build them anyway; doing it explicitly keeps a
      # Rust build failure in its own step instead of inside `pnpm run typecheck`.
      - name: Build WASM bindings from this revision
        run: bash scripts/build-wasm.sh

      - name: Run ESLint
        run: pnpm run lint

      - name: Check for runtime import cycles
        run: pnpm run check:cycles

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      # Previously only the IMPES bucket ran here, so a FIM convergence regression
      # or a cross-solver parity break passed CI. `all` is shared + FIM + IMPES.
      - name: Run Rust engine regression gates (shared + FIM + IMPES)
        run: bash scripts/validate-solver-coverage.sh all

      - name: Run Buckley-Leverett physics benchmarks
        run: cargo test --manifest-path src/lib/ressim/Cargo.toml benchmark_buckley -- --nocapture

      # The compositional engine and the EOS/flash stack match no filter in
      # `validate-solver-coverage.sh`, which is black-oil only, so without this step
      # they would sit in the tree with nothing running them on a PR.
      #
      # `thermo` and not `native`/`all`: the `fixture` mode hard-fails when the OPM
      # headers and g++ are absent, which they are on this runner, and `reference`
      # needs a built `flowexp_comp`. Both are local/offline gates. `thermo` is pure
      # Rust and self-contained. The wasm32 compile of the same code is already
      # covered by the "Build WASM bindings" step above.
      - name: Run compositional thermodynamics gates
        run: bash scripts/validate-compositional.sh thermo

      # `test:coverage` is the full vitest suite (`vitest run --coverage`), so it is
      # the pass/fail gate as well as the coverage producer. Running `pnpm run test`
      # first would execute the same ~8 minutes of scenario simulations twice.
      # The engine is consumed by more than the browser. This builds crates/ressim-py against the
      # engine with its wasm bindings switched off and compares the two bindings on a committed
      # fixture, so a change that re-entangles the engine, or that makes one binding disagree with
      # the other, fails here rather than in whichever consumer notices first.
      #
      # python3 is preinstalled on ubuntu-latest; the wasm bundle it compares against was built by
      # the "Build WASM bindings" step above.
      - name: Run native binding parity gate
        run: bash scripts/validate-native-binding.sh

      # docs/BENCHMARKS.md is generated from docs/benchmarks/benchmarks.json (#54). The fast tier
      # re-measures every section that needs no OPM Flow or flowexp_comp and fails when a banded
      # error grows by more than a tenth of its band, leaves it, or is no longer produced; then it
      # fails if the page differs from what its records generate. Flow-backed rows are reported as
      # not checked, never as passed.
      - name: Check benchmark records and the generated benchmark page (fast tier)
        run: bash scripts/benchmarks.sh check --tier fast

      # The OPM artifact pipeline's unit contract, provenance and deck-hash checks (#20). Flow is
      # not needed: the tests read the committed artifacts and trimmed real summaries.
      - name: Run OPM artifact pipeline tests
        working-directory: tools/opm_flow
        run: |
          python3 -m venv "$RUNNER_TEMP/opm-venv"
          "$RUNNER_TEMP/opm-venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/opm-venv/bin/python" -m pytest -q

      - name: Run unit tests (Vitest) and upload coverage
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/**

      - name: Build production bundle
        run: pnpm run build

      # Everything above this point can pass while the application is broken in a browser: the
      # unit suite does not render, and a Tailwind content-glob miss produces an unstyled page
      # with no error anywhere. `test:deployed` already guards the *deployed* site in
      # publish-dist.yml, which is too late to stop a regression entering the branch.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-test the built bundle in a browser
        run: |
          # Redirect the server's output: a background process that inherits stdout keeps the
          # step's pipe open, so the step never finishes even after the tests pass. And capture
          # $! rather than using `kill %1` -- job control is off in a non-interactive shell, so
          # the job spec would silently fail to match.
          #
          # Bind 127.0.0.1 explicitly: that is what the wait loop and playwright.config.ts use,
          # and vite's default `localhost` can resolve to ::1 on the runner, leaving 127.0.0.1
          # refused (the first CI run of this step, on PR #41, failed exactly so).
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          preview_pid=$!
          up=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ressim/ > /dev/null; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then
            echo "::error::preview server did not answer on 127.0.0.1:4173 within 60 s"
            cat /tmp/preview.log
            kill "$preview_pid" 2> /dev/null || true
            exit 1
          fi
          if pnpm run test:deployed; then status=0; else status=$?; fi
          kill "$preview_pid" 2> /dev/null || true
          [ "$status" = 0 ] || cat /tmp/preview.log
          exit $status

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-smoke-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
