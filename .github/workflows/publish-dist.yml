name: Validate, publish, and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ressim-master-deployment
  cancel-in-progress: false

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESIM_BUILD_SHA: ${{ github.sha }}
      RESIM_BUILD_REF: ${{ github.ref_name }}
      # Deploy the root layout; the legacy /ressim/ build remains available explicitly.
      RESIM_BASE_PATH: /
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      metadata_file: ${{ steps.package.outputs.metadata_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ressim-benchmark-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `src/lib/ressim/pkg/` is generated and no longer committed (#30). Without
      # this step the wasm would first be built by `validate:product`'s leading
      # `typecheck` hook; building it explicitly keeps a Rust failure in its own
      # step and matches `pr-tests.yml`.
      - name: Build WASM bindings from this revision
        run: bash scripts/build-wasm.sh

      - name: Validate product and build deployment
        run: pnpm run validate:product

      - name: Verify revision and package SHA-addressed production artifact
        id: package
        run: pnpm run package:dist

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: ressim-dist-bundle
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.metadata_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.package.outputs.app_dir }}

  deploy-pages:
    if: vars.RESSIM_PAGES_ENABLED != 'false'
    runs-on: ubuntu-latest
    needs: build-artifact
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy exact build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-pages:
    runs-on: ubuntu-latest
    needs: deploy-pages
    permissions:
      contents: read
    env:
      RESIM_BASE_PATH: /
      RESIM_PUBLIC_URL: https://ressim.farin.nl/
      RESIM_EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout smoke suite
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-test deployed Pages revision
        run: pnpm run test:deployed

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-artifact
      - smoke-pages
    permissions:
      contents: write

    steps:
      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: ressim-dist-bundle

      - name: Publish immutable SHA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dist-${{ github.sha }}
          name: dist-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ needs.build-artifact.outputs.archive }}
            ${{ needs.build-artifact.outputs.metadata_file }}
          generate_release_notes: false
          make_latest: true
          overwrite_files: true

  
